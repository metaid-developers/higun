# UTXO Indexer Configuration
chain: "btc"
network: "regtest" # mainnet/testnet/regtest
block_info_indexer: false
data_dir: "/home/momo/data/higun/test"
backup_dir: "/home/momo/data/higun/backups"
block_files_dir: "/home/momo/data/higun/blockFiles"
shard_count: 2
tx_concurrency: 64 # How many concurrent requests to fetch raw transactions from nodes
workers: 24
batch_size: 50000
mem_utxo_max_count: 14000000 # Memory UTXO cache size (~4.2GB), BlockCache reduced to 20MB for more UTXO cache
cpu_cores: 1 # 4-core CPU
memory_gb: 4 # 64GB memory
high_perf: true # Prefer performance
api_port: "3001"
zmq_address:
  - "tcp://127.0.0.1:28333" # ZeroMQ connection address
mempool_clean_start_height: 300 # 已废弃: 现在自动判断，仅在同步到最新区块时才清理内存池
max_tx_per_batch: 30000
zmq_reconnect_interval: 1
# Bitcoin RPC Configuration
rpc:
  chain: "btc"
  host: "127.0.0.1"
  port: "18443"
  user: "test"
  password: "test"

diagnostics:
  enabled: false
  bind: "127.0.0.1:6060"
  pprof_enabled: true
  expvar_enabled: true
  sample_interval_seconds: 30
  profile_dir: "data/diagnostics"
  high_water_profile_percents: [70, 80, 90]
  memory_log_every_n_blocks: 1
  memory_checkpoint_min_percent: 0

memory_budget:
  use_cgroup_limit: true
  go_memory_limit_percent: 65
  pebble_cache_percent: 12
  pebble_memtable_percent: 8
  reserve_percent: 15
  main_store_count: 5
  cgroup_root: "/sys/fs/cgroup"
  force_cgroup_limit_bytes: 0

wallet:
  enabled: false
  timeout_seconds: 10
  chains:
    btc:
      enabled: false
      core_url: "http://127.0.0.1:8066"
      broadcast_path: "/btc/broadcast"
      fee_rate:
        unit: sat_per_byte
        slow: 1
        normal: 3
        fast: 5
        default: normal
    mvc:
      enabled: false
      core_url: "http://127.0.0.1:8085"
      broadcast_path: "/btc/broadcast"
      fee_rate:
        unit: sat_per_byte
        slow: 1
        normal: 2
        fast: 3
        default: normal
    doge:
      enabled: false
      core_url: "http://127.0.0.1:8068"
      broadcast_path: "/btc/broadcast"
      fee_rate:
        unit: sat_per_byte
        slow: 1
        normal: 2
        fast: 5
        default: normal
